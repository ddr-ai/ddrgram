name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:app
      - run: npm run build
        env:
          VITE_TELEGRAM_API_ID: ${{ secrets.VITE_TELEGRAM_API_ID }}
          VITE_TELEGRAM_API_HASH: ${{ secrets.VITE_TELEGRAM_API_HASH }}
      - name: Resolve Pages artifact directory
        id: dist
        run: |
          if [ -f dist/client/index.html ]; then
            echo "path=dist/client" >> "$GITHUB_OUTPUT"
          elif [ -f dist/index.html ]; then
            echo "path=dist" >> "$GITHUB_OUTPUT"
          elif [ -f .output/public/index.html ]; then
            echo "path=.output/public" >> "$GITHUB_OUTPUT"
          elif [ -f .vercel/output/static/index.html ]; then
            echo "path=.vercel/output/static" >> "$GITHUB_OUTPUT"
          else
            echo "No static index.html found" >&2
            find dist .output .vercel -name 'index.html' -o -name '_shell.html' 2>/dev/null || true
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.dist.outputs.path }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
